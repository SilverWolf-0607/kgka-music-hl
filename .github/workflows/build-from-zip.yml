name: Build APK from zip

# 手机网页最省事方案：
#   1) 新建空仓库（Private）
#   2) 上传 kgka_src.zip 到仓库根目录
#   3) 新建本文件 .github/workflows/build-from-zip.yml
#   4) 自动触发：解压 → flutter pub get → flutter build apk --release → 上传 artifact

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  build:
    name: build release apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Unzip source
        run: |
          ls -lh
          mkdir -p src
          unzip -q kgka_src.zip -d src
          echo '--- src ---'
          ls src | head -20

      - name: Pub get
        working-directory: src
        run: flutter pub get

      - name: Build release APK
        working-directory: src
        run: flutter build apk --release

      - name: Show artifact
        run: ls -lh src/build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kgka-music-release-apk
          path: src/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30